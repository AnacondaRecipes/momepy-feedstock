{% set name = "momepy" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7bc2289a4b2d97f2c1267a9ee318cf1c94998e7098d1c6ad6c662a01bc3d9fe6

build:
  skip: true  # [py<312]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - toml
    - wheel
  run:
    - python
    - geopandas >=1.1
    - libpysal >=4.12.1
    - networkx >=3.4
    - numpy >=2.0
    - packaging
    - pandas >=2.3
    - shapely >=2.1
    - tqdm >=4.67
  run_constrained:
    - esda
    - inequality
    - mapclassify
    - numba >=0.60
    - osmnx
    - rioxarray
    - neatnet

# E   ModuleNotFoundError: No module named 'neatnet'
{% set ignore_tests = "--ignore=momepy/tests/test_continuity.py" %}
# GEOS 3.10.6 on pkgs/main (shapely build) is below the GEOS 3.12 required by momepy's coverage_simplify, so these geometry-expectation tests fail; deselect until GEOS >=3.12 lands on main
{% set ignore_tests = ignore_tests + " --deselect=momepy/tests/test_elements.py::TestElements::test_morphological_tessellation" %}
{% set ignore_tests = ignore_tests + " --deselect=momepy/tests/test_distribution.py::TestDistribution::test_alignment" %}
{% set ignore_tests = ignore_tests + " --deselect=momepy/tests/test_distribution.py::TestDistribution::test_street_alignment" %}
{% set ignore_tests = ignore_tests + " --deselect=momepy/tests/test_shape.py::TestShape::test_equivalent_rectangular_index" %}

test:
  source_files:
    - momepy/tests
  imports:
    - momepy
  commands:
    - pip check
    - pytest -vv momepy/tests {{ ignore_tests }}
  requires:
    - pip
    - pytest
    - inequality
    - mapclassify
    - numba
    - esda

about:
  home: https://docs.momepy.org
  summary: Urban Morphology Measuring Toolkit
  description: |
    Momepy is a library for quantitative analysis of urban form - urban morphometrics.
    It is part of PySAL (Python Spatial Analysis Library) and is built on top of GeoPandas,
    other PySAL modules, and networkX.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://docs.momepy.org
  dev_url: https://github.com/pysal/momepy

extra:
  recipe-maintainers:
    - psteyer
